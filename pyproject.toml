[project]
name = "continuum"
version = "0.1.0"
description = "Kontinuierlich lernendes autonomes Forschungssystem (Phase-0-Prototyp)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]
# Spätere Phasen (siehe ROADMAP.md) — bewusst NICHT als Kernabhängigkeit,
# damit Phase 0 ohne GPU/schwere Downloads lauffähig bleibt.
phase2 = [
    "torch>=2.1",
    "transformers>=4.40",
    "peft>=0.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"continuum.data" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
